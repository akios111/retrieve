<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Μηχανή Αναζήτησης Wikipedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/jquery-ui@1.13.2/dist/themes/base/jquery-ui.min.css" rel="stylesheet">
    <style>
        .search-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
        }
        .search-box {
            margin: 30px 0;
        }
        .search-options {
            margin: 20px 0;
        }
        .results-container {
            margin-top: 30px;
        }
        .result-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .result-item:hover {
            background-color: #f8f9fa;
        }
        .result-title {
            color: #1a0dab;
            font-size: 18px;
            margin-bottom: 5px;
            text-decoration: none;
        }
        .result-title:hover {
            text-decoration: underline;
        }
        .result-score {
            color: #006621;
            font-size: 14px;
        }
        .result-snippet {
            color: #545454;
            font-size: 14px;
            margin-top: 5px;
            line-height: 1.4;
        }
        #error-message {
            color: #dc3545;
            margin-top: 10px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .search-help {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .filters-container {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .filter-group {
            margin-bottom: 15px;
        }
        .filter-label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .category-filter {
            max-height: 150px;
            overflow-y: auto;
        }
        .ui-autocomplete {
            max-height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1000;
        }
        .ui-menu-item {
            padding: 5px 10px;
            cursor: pointer;
        }
        .ui-menu-item:hover {
            background-color: #f8f9fa;
        }
        .highlight {
            background-color: #fff3cd;
            padding: 0 2px;
        }
        .visualization-container {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #relevanceChart {
            width: 100%;
            height: 300px;
        }
        .article-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }
        .article-content {
            position: relative;
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .article-text {
            margin-top: 20px;
            line-height: 1.6;
            font-size: 16px;
        }
        .close-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            transition: color 0.2s;
        }
        .close-modal:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container search-container">
        <h1 class="text-center">Μηχανή Αναζήτησης Wikipedia</h1>
        
        <div class="search-box">
            <form id="search-form">
                <div class="mb-3">
                    <input type="text" id="query" class="form-control" 
                           placeholder="Εισάγετε το ερώτημά σας..." required>
                    <div class="search-help">
                        <strong>Boolean αναζήτηση:</strong> Χρησιμοποιήστε && (AND), || (OR), ! (NOT)<br>
                        π.χ. "φιλοσοφία && επιστήμη", "τεχνητή || νοημοσύνη", "ιστορία && !τέχνη"
                    </div>
                </div>
                
                <div class="filters-container">
                    <h5>Φίλτρα Αναζήτησης</h5>
                    
                    <div class="filter-group">
                        <div class="filter-label">Χατηγορίες</div>
                        <div class="category-filter">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Επιστήμη" id="catScience">
                                <label class="form-check-label" for="catScience">Επιστήμη</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Ιστορία" id="catHistory">
                                <label class="form-check-label" for="catHistory">Ιστορία</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Τέχνη" id="catArt">
                                <label class="form-check-label" for="catArt">Τέχνη</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Φιλοσοφία" id="catPhilosophy">
                                <label class="form-check-label" for="catPhilosophy">Φιλοσοφία</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Τεχνολογία" id="catTechnology">
                                <label class="form-check-label" for="catTechnology">Τεχνολογία</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="search-options">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="searchMethod" 
                               id="methodBoolean" value="boolean">
                        <label class="form-check-label" for="methodBoolean">Boolean</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="searchMethod" 
                               id="methodVSM" value="vsm" checked>
                        <label class="form-check-label" for="methodVSM">Vector Space Model</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="searchMethod" 
                               id="methodBM25" value="bm25">
                        <label class="form-check-label" for="methodBM25">BM25</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Αναζήτηση</button>
            </form>
            <div id="error-message"></div>
        </div>
        
        <div class="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Φόρτωση...</span>
            </div>
        </div>
        
        <div id="results" class="results-container"></div>
        
        <div class="visualization-container" style="display: none;">
            <h5>Οπτικοποίηση Σχετικότητας</h5>
            <canvas id="relevanceChart"></canvas>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        $(document).ready(function() {
            // Autocomplete
            $('#query').autocomplete({
                source: function(request, response) {
                    $.ajax({
                        url: '/suggest',
                        method: 'POST',
                        data: { 
                            term: request.term
                        },
                        success: function(data) {
                            response(data.suggestions);
                        }
                    });
                },
                minLength: 2,
                select: function(event, ui) {
                    $('#query').val(ui.item.value);
                    $('#search-form').submit();
                }
            });
            
            // Αλλαγή placeholder ανάλογα με τη μέθοδο αναζήτησης
            $('input[name="searchMethod"]').on('change', function() {
                const method = $(this).val();
                const query = $('#query');
                
                if (method === 'boolean') {
                    query.attr('placeholder', 'π.χ. φιλοσοφία && επιστήμη || τέχνη');
                } else if (method === 'vsm') {
                    query.attr('placeholder', 'π.χ. φιλοσοφία και επιστήμη');
                } else {
                    query.attr('placeholder', 'π.χ. ιστορία της τέχνης');
                }
            });
            
            let relevanceChart = null;
            
            $('#search-form').on('submit', function(e) {
                e.preventDefault();
                
                const query = $('#query').val().trim();
                const method = $('input[name="searchMethod"]:checked').val();
                const categories = [];
                
                $('.category-filter input:checked').each(function() {
                    categories.push($(this).val());
                });
                
                if (!query) {
                    showError('Παρακαλώ εισάγετε ένα ερώτημα αναζήτησης');
                    return;
                }
                
                // Εμφάνιση loading spinner
                $('.loading').show();
                $('#results').empty();
                $('#error-message').hide();
                $('.visualization-container').hide();
                
                $.ajax({
                    url: '/search',
                    method: 'POST',
                    data: { 
                        query: query,
                        method: method,
                        categories: JSON.stringify(categories)
                    },
                    success: function(response) {
                        displayResults(response);
                        visualizeResults(response);
                    },
                    error: function(xhr) {
                        const error = xhr.responseJSON ? xhr.responseJSON.error : 'Σφάλμα κατά την αναζήτηση';
                        showError(error);
                    },
                    complete: function() {
                        $('.loading').hide();
                    }
                });
            });
            
            function displayResults(data) {
                const resultsDiv = $('#results');
                resultsDiv.empty();
                
                if (!data.results || data.results.length === 0) {
                    resultsDiv.html('<p class="text-center">Δεν βρέθηκαν αποτελέσματα</p>');
                    return;
                }
                
                data.results.forEach(function(result) {
                    // Highlight των όρων αναζήτησης στο snippet
                    const highlightedSnippet = highlightSearchTerms(result.snippet, data.query);
                    
                    const resultHtml = `
                        <div class="result-item" data-title="${result.title}">
                            <h3 class="result-title">${result.title}</h3>
                            <div class="result-score">Score: ${result.score.toFixed(4)}</div>
                            <div class="result-categories">Κατηγορίες: ${result.categories.join(', ')}</div>
                            ${result.date ? `<div class="result-date">Ημερομηνία: ${result.date}</div>` : ''}
                            <div class="result-snippet">${highlightedSnippet}</div>
                        </div>
                    `;
                    resultsDiv.append(resultHtml);
                });
                
                // Event handler για το άνοιγμα του άρθρου
                $('.result-item').click(function() {
                    const title = $(this).data('title');
                    $.ajax({
                        url: '/article',
                        method: 'POST',
                        data: { title: title },
                        success: function(response) {
                            showArticleModal(response.title, response.content);
                        }
                    });
                });
            }
            
            function highlightSearchTerms(text, query) {
                // Διαχωρισμός του query σε όρους
                const terms = query.toLowerCase().split(/\s+/);
                
                // Αντικατάσταση κάθε όρου με την highlighted έκδοσή του
                terms.forEach(term => {
                    if (term && !['και', 'ή', 'όχι', '&&', '||', '!'].includes(term)) {
                        const regex = new RegExp(`(${term})`, 'gi');
                        text = text.replace(regex, '<span class="highlight">$1</span>');
                    }
                });
                
                return text;
            }
            
            function visualizeResults(data) {
                $('.visualization-container').show();
                
                const ctx = document.getElementById('relevanceChart').getContext('2d');
                const labels = data.results.map(r => r.title);
                const scores = data.results.map(r => r.score);
                
                if (relevanceChart) {
                    relevanceChart.destroy();
                }
                
                relevanceChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Σχετικότητα',
                            data: scores,
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Score'
                                }
                            },
                            x: {
                                ticks: {
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            }
                        },
                        plugins: {
                            title: {
                                display: true,
                                text: 'Σχετικότητα Αποτελεσμάτων'
                            }
                        }
                    }
                });
            }
            
            function showError(message) {
                $('#error-message').text(message).show();
                $('.loading').hide();
            }
            
            // Event listener για κλικ στα αποτελέσματα
            $('#results').on('click', '.result-item', function() {
                const title = $(this).find('.result-title').text();
                const dwell_time = 30; // Παράδειγμα: 30 δευτερόλεπτα
                
                // Αποστολή feedback στον server
                $.ajax({
                    url: '/feedback',
                    method: 'POST',
                    data: {
                        title: title,
                        query: $('#query').val(),
                        dwell_time: dwell_time
                    }
                });
            });
            
            function showArticleModal(title, content) {
                // Αφαίρεση προηγούμενου modal αν υπάρχει
                $('.article-modal').remove();
                
                const modalHtml = `
                    <div class="article-modal" style="display: block;">
                        <div class="article-content">
                            <span class="close-modal">&times;</span>
                            <h2>${title}</h2>
                            <div class="article-text">${content.replace(/\n/g, '<br>')}</div>
                        </div>
                    </div>
                `;
                
                $('body').append(modalHtml);
                
                // Event handlers για κλείσιμο του modal
                $('.close-modal').click(function() {
                    $('.article-modal').remove();
                });
                
                $(window).click(function(e) {
                    if ($(e.target).hasClass('article-modal')) {
                        $('.article-modal').remove();
                    }
                });
                
                // Αποτροπή του κλεισίματος όταν κάνουμε κλικ μέσα στο content
                $('.article-content').click(function(e) {
                    e.stopPropagation();
                });
            }
        });
    </script>
</body>
</html>
